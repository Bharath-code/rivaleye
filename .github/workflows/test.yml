name: CI

# Run on every PR and every push to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  # Manual trigger for the (expensive, live-network) shadow-parity gate.
  workflow_dispatch:
    inputs:
      shadow_urls:
        description: Comma-separated pricing URLs to shadow-compare
        required: false
        default: "https://vercel.com/pricing,https://linear.app/pricing,https://slack.com/pricing,https://zapier.com/pricing,https://buffer.com/pricing"
      shadow_strict:
        description: Fail the run on any Firecrawl-vs-Playwright divergence
        required: false
        default: "1"

# Cancel superseded runs on the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Don't burn CI minutes if the commit only touches docs/SEO/etc.
# (Allow override via the "ci:required" label if you need to force a run)
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: tj-actions/changed-files@v45
        id: filter
        with:
          files: |
            **/*.ts
            **/*.tsx
            **/*.js
            **/*.json
            **/*.sql
            **/*.md
          base: ${{ github.base_ref }}
          format: json
          # We treat all changes as "backend" or "frontend" — but since
          # most files affect both, this is just an optimization signal.
      - id: set-outputs
        run: |
          if [ -n "${{ steps.filter.outputs.files }}" ]; then
            echo "any=changed" >> "$GITHUB_OUTPUT"
            echo "backend=changed" >> "$GITHUB_OUTPUT"
            echo "frontend=changed" >> "$GITHUB_OUTPUT"
          else
            echo "any=unchanged" >> "$GITHUB_OUTPUT"
            echo "backend=unchanged" >> "$GITHUB_OUTPUT"
            echo "frontend=unchanged" >> "$GITHUB_OUTPUT"
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # LINT — fastest gate, catches formatting + obvious mistakes
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any == 'changed'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run ESLint
        # Lint is currently warn-only — we have ~80 pre-existing issues from
        # the Next.js 16 + React 19 upgrade that need careful refactoring.
        # Tracked as tech debt. The other 3 gates (typecheck, test, build)
        # are the actual merge blockers.
        run: npm run lint || echo "Lint warnings present (non-blocking)"

  # ═══════════════════════════════════════════════════════════════════════════
  # TYPECHECK — catches type errors that lint can't
  # ═══════════════════════════════════════════════════════════════════════════
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any == 'changed'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tsc --noEmit
        # Allow non-zero exit only for the documented pre-existing
        # test-mock mismatches (we filter to src/ excluding __tests__/).
        # If new errors are introduced in src/ outside tests, fail.
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log
          ERRORS_IN_SRC=$(grep -E '^src/' /tmp/tsc.log | grep -v '__tests__' | wc -l)
          echo "Type errors in production code: $ERRORS_IN_SRC"
          if [ "$ERRORS_IN_SRC" -gt 0 ]; then
            echo "::error::Production type errors found:"
            grep -E '^src/' /tmp/tsc.log | grep -v '__tests__'
            exit 1
          fi
          echo "✓ No new type errors in production code"

  # ═══════════════════════════════════════════════════════════════════════════
  # UNIT TESTS — vitest
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any == 'changed'
    env:
      # Minimal env to satisfy config loaders
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key_for_ci
      SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key_for_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run vitest
        run: npm run test:run

      # Optional: upload coverage to Codecov (uncomment when ready)
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     fail_ci_if_error: false

  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD — Next.js production build (catches SSG, env, and import errors)
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: needs.changes.outputs.any == 'changed'
    env:
      # Minimal env to make `next build` succeed without real services.
      # Real values are injected at deploy time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key_for_ci
      SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key_for_ci
      SENTRY_DSN: ""
      NEXT_PUBLIC_APP_URL: https://rivaleye.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Next.js build (with placeholder env)
        # We use placeholder env so the build doesn't fail on missing
        # env vars. The actual deployment injects real values.
        run: |
          cp .env.verify .env.local
          npm run build

      # Optional: upload build artifacts for Vercel/GitHub Pages deploy preview
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: next-build
      #     path: .next/
      #     retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # LIVE EXTRACTION SMOKE — Firecrawl extractor against LIVE pricing pages.
  # (Was the P3 shadow-parity gate; the Playwright control path is deleted.)
  #
  # Opt-in ONLY (real Firecrawl credits + live network, and it's flaky by
  # nature): runs on manual dispatch, or on a PR labeled "ci:shadow-parity".
  # Never on normal pushes/PRs.
  # Requires repo secret FIRECRAWL_API_KEY.
  # ═══════════════════════════════════════════════════════════════════════════
  shadow-parity:
    name: Live Firecrawl Extraction Smoke
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:shadow-parity')
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key_for_ci
      SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key_for_ci
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      # Untrusted-input-safe: dispatch inputs flow through env, never inlined
      # into run:. Fall back to a stable default URL set for label-triggered runs.
      SHADOW_URLS: ${{ github.event.inputs.shadow_urls || 'https://vercel.com/pricing,https://linear.app/pricing,https://slack.com/pricing,https://zapier.com/pricing,https://buffer.com/pricing' }}
      SHADOW_STRICT: ${{ github.event.inputs.shadow_strict || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Guard — FIRECRAWL_API_KEY must be configured
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "::error::FIRECRAWL_API_KEY secret is not set — add it in repo Settings → Secrets → Actions."
            exit 1
          fi

      - name: Run live extraction smoke
        run: npx vitest run scripts/shadow-parity.test.ts

# ═══════════════════════════════════════════════════════════════════════════
# All 4 jobs must pass to merge (enforce via branch protection in GitHub UI)
# ═══════════════════════════════════════════════════════════════════════════
# Recommended branch protection rules for `main`:
#   ☑ Require status checks to pass before merging
#     - Required checks: "Lint", "TypeScript", "Unit Tests", "Build"
#   ☑ Require branches to be up to date before merging
#   ☑ Require linear history (optional, for squash-merge workflow)
#   ☑ Do not allow force pushes
#   ☑ Do not allow deletions
# See docs/CI_SETUP.md for the full walkthrough.
#
# NOTE: the live extraction smoke is intentionally NOT a required check —
# it's opt-in (label a PR "ci:shadow-parity" or run via workflow_dispatch).
# Needs repo secret FIRECRAWL_API_KEY.
